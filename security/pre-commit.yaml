repos:
  - repo: https://github.com/crytic/slither
    rev: v0.11.3
    hooks:
      - id: slither
        args: [--config=./security/slither.config.json]
        files: \.sol$

  - repo: https://github.com/aj-ow/prettier-plugin-solidity
    rev: v1.3.0
    hooks:
      - id: prettier
        args: [--write, --plugin=prettier-plugin-solidity]
        files: \.sol$

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.81.0
    hooks:
      - id: terraform_fmt
        name: Foundry config formatting
        files: foundry\.toml$
